<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品详情</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:#f8f9fa;padding-bottom:40px}
        .edit-bar,.export-btn{display:none!important}
        
        .header{background:#fff;padding:15px 20px;border-bottom:1px solid #eee;margin-top:30px}
        .header-inner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .back{color:#0066cc;cursor:pointer;font-size:16px}
        
        .container{max-width:1000px;margin:0 auto;padding:20px;text-align:center}
        .title{font-size:26px;margin-bottom:8px}
        .desc{font-size:16px;color:#666;margin-bottom:20px}
        
        .carousel{position:relative;width:100%;margin-bottom:20px}
        .slide{display:none}
        .slide.active{display:block}
        .slide img{width:100%;border-radius:8px}
        .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10}
        .prev{left:15px}
        .next{right:15px}
        
        .thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        .thumb{width:70px;height:70px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent}
        .thumb.active{border-color:#0066cc}
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div>陈志坚设计工作室</div>
        <div class="back" id="backBtn">← 返回</div>
    </div>
</div>

<div class="container">
    <h1 class="title" id="workTitle"></h1>
    <p class="desc" id="workDesc"></p>
    <div class="carousel" id="carousel">
        <div id="slides"></div>
        <button class="arrow prev" id="prevBtn">‹</button>
        <button class="arrow next" id="nextBtn">›</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
</div>

"images/pingmian/print1":{"title":"平面设计","desc":"小仙梅杨梅酒酒书"}
};

const params = new URLSearchParams(location.search);
const prefix = decodeURIComponent(params.get('prefix') || '');
const item = cache[prefix] || {title:'', desc:''};
document.getElementById('workTitle').innerText = item.title;
document.getElementById('workDesc').innerText = item.desc;

let curr = 0;
let total = 0;

async function loadDetailImages() {
    const slidesEl = document.getElementById('slides');
    const thumbsEl = document.getElementById('thumbs');
    let consecutiveMissing = 0;

    for (let i = 1; i <= 999; i++) {
        if (consecutiveMissing >= 20) break;
        const src = `${prefix}-${i}.jpg`;

        const exists = await new Promise(resolve => {
            const img = new Image();
            img.onload = () => resolve(true);
            img.onerror = () => resolve(false);
            img.src = src;
        });

        if (!exists) {
            consecutiveMissing++;
            continue;
        }

        consecutiveMissing = 0;
        const s = document.createElement('div');
        s.className = 'slide';
        s.innerHTML = `<img src="${src}">`;
        slidesEl.appendChild(s);

        const t = document.createElement('img');
        t.className = 'thumb';
        t.src = src;
        t.dataset.index = total;
        thumbsEl.appendChild(t);
        total++;
    }
    show(0);
}

function show(idx) {
    const slides = document.querySelectorAll('.slide');
    const thumbs = document.querySelectorAll('.thumb');
    if (total === 0) return;
    idx = Math.max(0, Math.min(total - 1, idx));
    curr = idx;
    slides.forEach((e, i) => e.classList.toggle('active', i === idx));
    thumbs.forEach((e, i) => e.classList.toggle('active', i === idx));
}

document.getElementById('prevBtn').onclick = () => show(curr - 1);
document.getElementById('nextBtn').onclick = () => show(curr + 1);
document.getElementById('thumbs').addEventListener('click', e => {
    if (e.target.classList.contains('thumb')) show(+e.target.dataset.index);
});
document.getElementById('backBtn').onclick = () => {
    let to = '#category-brand';
    if (prefix.includes('包装')) to = '#category-package';
    if (prefix.includes('空间')) to = '#category-space';
    if (prefix.includes('平面')) to = '#category-print';
    location.href = 'index.html' + to;
};

loadDetailImages();
</script>
</body>
</html>
