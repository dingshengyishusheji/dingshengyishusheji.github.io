<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品详情</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:#f8f9fa;padding-bottom:40px}
        
        .edit-bar{
            position:fixed;top:0;left:0;width:100%;
            background:#ffc107;color:#000;padding:6px 0;
            text-align:center;font-size:14px;z-index:9999;display:none !important;
        }
        .edit-bar.show{display:none !important;}
        
        .header{
            background:#fff;padding:15px 20px;border-bottom:1px solid #eee;margin-top:30px;
        }
        .header-inner{
            max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;
        }
        .back{color:#0066cc;cursor:pointer;font-size:16px}
        .export-btn{
            background:#0066cc;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;
            display:none !important; /* 永久隐藏导出按钮 */
        }
        
        .container{max-width:1000px;margin:0 auto;padding:20px;text-align:center}
        .title{font-size:26px;margin-bottom:8px}
        .desc{font-size:16px;color:#666;margin-bottom:20px}
        
        .carousel{position:relative;width:100%;margin-bottom:20px}
        .slide{display:none}
        .slide.active{display:block}
        .slide img{width:100%;border-radius:8px}
        .arrow{
            position:absolute;top:50%;transform:translateY(-50%);
            background:rgba(0,0,0,0.5);color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;
        }
        .prev{left:15px}
        .next{right:15px}
        
        .thumbs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        .thumb{width:70px;height:70px;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent}
        .thumb.active{border-color:#0066cc}
        
        .editable{outline:none;contentEditable:false !important;cursor:default !important;}
    </style>
<style type="text/css">.qa-sdk-wrapper {
  position: fixed;
  width: 400px;
  right: -600px;
  max-height: 530px;
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0px 0px 8px 0px rgba(0, 0, 0, 0.1);
  transition: all 0.5s ease-in-out;
  background: #fff;
}

.qa-sdk-close-btn {
  display: inline-block;
  width: 18px;
  height: 18px;
  cursor: pointer;
  position: absolute;
  top: 16px;
  right: 16px;
}

.qa-sdk-close-btn:hover {
  border-radius: 50%;
  background-color: #d5d9df;
}

#qa-sdk-iframe {
  width: 400px;
}

@media (min-width: 1024px) and (max-width: 1366px) {
  .qa-sdk-wrapper{
    width: 356px;
  }
  #qa-sdk-iframe {
    width: 356px;
  }
}
</style><style id="ai-assist-webType-style">
    .ai-assist-highlight {
      background: yellow;
    }
    @media print {
      #ai-assist-root-bangs,
      #ai-assist-root-bilibili,
      #ai-assist-root-new {
        display: none !important;
      }
    }
  </style></head>

<body>

<div class="edit-bar" id="editBar">编辑中：双击空白退出并自动保存</div>

<div class="header">
    <div class="header-inner">
        <div>杭州鼎笙艺术设计</div>
        <div style="display:flex;gap:12px;align-items:center">
            <div class="back" id="backBtn">← 返回</div>
            <button class="export-btn" id="saveBtn">导出并替换原文件</button>
        </div>
    </div>
</div>

<div class="container">
    <h1 class="title editable" id="workTitle">品牌logo及应用</h1>
    <p class="desc editable" id="workDesc">法国黑公鸡红酒</p>

    <div class="carousel" id="carousel">
        <div id="slides"><div class="slide active"><img src="images/品牌设计类/brand3-1.jpg"></div><div class="slide"><img src="images/品牌设计类/brand3-2.jpg"></div><div class="slide"><img src="images/品牌设计类/brand3-3.jpg"></div><div class="slide"><img src="images/品牌设计类/brand3-4.jpg"></div><div class="slide"><img src="images/品牌设计类/brand3-5.jpg"></div></div>
        <button class="arrow prev" id="prevBtn">‹</button>
        <button class="arrow next" id="nextBtn">›</button>
    </div>

    <div class="thumbs" id="thumbs"><img class="thumb active" src="images/品牌设计类/brand3-1.jpg" data-index="0"><img class="thumb" src="images/品牌设计类/brand3-2.jpg" data-index="1"><img class="thumb" src="images/品牌设计类/brand3-3.jpg" data-index="2"><img class="thumb" src="images/品牌设计类/brand3-4.jpg" data-index="3"><img class="thumb" src="images/品牌设计类/brand3-5.jpg" data-index="4"></div>
</div>

<script>
// ==================== URL 参数 ====================
const params = new URLSearchParams(location.search);
const title = decodeURIComponent(params.get('title') || '作品标题');
const prefix = decodeURIComponent(params.get('prefix') || '');
const pageKey = "DETAIL_" + (prefix || "default");

// ==================== 元素 ====================
const titleEl = document.getElementById('workTitle');
const descEl = document.getElementById('workDesc');
const slidesEl = document.getElementById('slides');
const thumbsEl = document.getElementById('thumbs');

// ==================== 本地自动保存 ====================
function loadSave(){
    const t = localStorage.getItem(pageKey+"_title");
    const d = localStorage.getItem(pageKey+"_desc");
    if(t) titleEl.innerText = t; else titleEl.innerText = title;
    if(d) descEl.innerText = d;
    // 强制禁用编辑
    titleEl.contentEditable = false;
    descEl.contentEditable = false;
}
function saveNow(){
    return; // 屏蔽保存逻辑
}

loadSave();
titleEl.removeEventListener('input', saveNow); // 移除保存事件
descEl.removeEventListener('input', saveNow); // 移除保存事件

// ==================== 加载轮播 ====================
let curr = 0;
let total = 0;

async function loadImgs(){
    slidesEl.innerHTML = "";
    thumbsEl.innerHTML = "";
    if(!prefix) return;
    for(let i=1;i<=20;i++){
        const src = prefix+"-"+i+".jpg";
        const img = new Image();
        img.src = src;
        await new Promise(r=>{
            img.onload=()=>{
                const s = document.createElement("div");
                s.className="slide";
                s.innerHTML=`<img src="${src}">`;
                slidesEl.appendChild(s);
                
                const t = document.createElement("img");
                t.className="thumb";
                t.src=src;
                t.dataset.index = total;
                thumbsEl.appendChild(t);
                total++; r();
            };
            img.onerror=()=>r(0);
        });
    }
    show(0);
}

function show(idx){
    const slides = document.querySelectorAll('.slide');
    const thumbs = document.querySelectorAll('.thumb');
    if(total===0)return;
    if(idx<0)idx=0; if(idx>=total)idx=total-1;
    curr=idx;
    slides.forEach((e,i)=>e.classList.toggle('active',i===idx));
    thumbs.forEach((e,i)=>e.classList.toggle('active',i===idx));
}

document.getElementById('prevBtn').onclick=()=>show(curr-1);
document.getElementById('nextBtn').onclick=()=>show(curr+1);
thumbsEl.addEventListener('click',e=>{
    if(e.target.classList.contains('thumb')) show(Number(e.target.dataset.index));
});

// ==================== 双击编辑 ====================
let edit=false;
document.addEventListener('dblclick',()=>{
    return; // 屏蔽编辑模式切换
});

// ==================== 返回 ====================
document.getElementById('backBtn').onclick=()=>{
    // 屏蔽编辑判断，直接返回
    let to="#category-brand";
    if(prefix.includes("包装"))to="#category-package";
    if(prefix.includes("空间"))to="#category-space";
    if(prefix.includes("平面"))to="#category-print";
    location.href="index.html"+to;
};

// ==================== 导出并替换原文件 ====================
document.getElementById('saveBtn').onclick=()=>{
    return; // 屏蔽导出逻辑
};

loadImgs();
</script>

<div id="agent"></div></body><div id="ai-assist-root-bangs"></div><div id="shadow-root-ai-zhishiku"></div><div id="ai-assist-root-new"></div></html>
